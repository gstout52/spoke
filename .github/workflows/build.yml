name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode signing key
        run: echo "${{ secrets.MURMUR_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/murmur.jks"

      - name: Build release APK
        env:
          MURMUR_KEYSTORE: ${{ runner.temp }}/murmur.jks
          MURMUR_KEYSTORE_PASSWORD: ${{ secrets.MURMUR_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk murmur.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Murmur build ${{ github.run_number }}
          files: murmur.apk
          make_latest: true
