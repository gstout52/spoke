name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only builds from this repo (never forks) get the signing key.
    if: github.repository_owner == 'gstout52'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.10.2"

      - name: Decode signing key
        run: echo "${{ secrets.MURMUR_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/murmur.jks"

      - name: Build release APK
        env:
          MURMUR_KEYSTORE: ${{ runner.temp }}/murmur.jks
          MURMUR_KEYSTORE_PASSWORD: ${{ secrets.MURMUR_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk murmur.apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Murmur build ${{ github.run_number }}
          files: murmur.apk
          make_latest: true
